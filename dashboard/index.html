<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic Trading — Decision Log</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121822;
    --border: #232c38;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4fd1c5;
    --approve: #3fb950;
    --veto: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr.cycle-row { cursor: pointer; }
  tr.cycle-row:hover { background: rgba(255,255,255,0.03); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge.approve { background: rgba(63,185,80,0.15); color: var(--approve); }
  .badge.veto { background: rgba(248,81,73,0.15); color: var(--veto); }
  .reasoning-row td { padding: 0 10px 14px; color: var(--muted); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 13px; padding: 24px 0; text-align: center; }
  code.small { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Agentic Trading — Decision Log</h1>
  <p>Reads <code class="small">logs/decision-log.jsonl</code> live. Click a row to expand the agent's reasoning.</p>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="panel">
    <h2>Equity curve (paper ledger)</h2>
    <canvas id="equityChart" height="90"></canvas>
  </div>
  <div class="panel">
    <h2>Decision cycles</h2>
    <div id="tableWrap"><div class="empty">Loading…</div></div>
  </div>
</main>
<script>
async function loadLog() {
  const res = await fetch("/logs/decision-log.jsonl", { cache: "no-store" });
  if (!res.ok) return [];
  const text = await res.text();
  return text
    .split("\n")
    .map((l) => l.trim())
    .filter(Boolean)
    .map((l) => {
      try { return JSON.parse(l); } catch { return null; }
    })
    .filter(Boolean);
}

function fmtUsd(n) {
  return typeof n === "number" ? `$${n.toFixed(2)}` : "—";
}

function render(entries) {
  const wrap = document.getElementById("tableWrap");
  const statsEl = document.getElementById("stats");

  if (!entries.length) {
    wrap.innerHTML = '<div class="empty">No cycles logged yet. Run <code class="small">npm run start</code> (or start:dry) at least once.</div>';
    statsEl.innerHTML = "";
    return;
  }

  const last = entries[entries.length - 1];
  const equityCurve = last.ledgerSnapshot?.equityCurve ?? [];
  const startingCash = last.ledgerSnapshot?.startingCash ?? 0;
  const latestEquity = last.ledgerSnapshot?.equity ?? startingCash;
  const approvedCount = entries.filter((e) => e.riskVerdict?.approved).length;
  const vetoCount = entries.length - approvedCount;

  statsEl.innerHTML = `
    <div class="stat"><div class="label">Cycles logged</div><div class="value">${entries.length}</div></div>
    <div class="stat"><div class="label">Equity</div><div class="value">${fmtUsd(latestEquity)}</div></div>
    <div class="stat"><div class="label">P/L vs start</div><div class="value">${fmtUsd(latestEquity - startingCash)}</div></div>
    <div class="stat"><div class="label">Approved / Vetoed</div><div class="value">${approvedCount} / ${vetoCount}</div></div>
    <div class="stat"><div class="label">Max drawdown</div><div class="value">${(last.ledgerSnapshot?.currentDrawdownPct ?? 0).toFixed(1)}%</div></div>
  `;

  const rows = entries
    .slice()
    .reverse()
    .map((e, i) => {
      const approved = !!e.riskVerdict?.approved;
      const action = e.proposedTrade?.action ?? "—";
      const symbol = e.proposedTrade?.symbol ?? "—";
      const id = `reason-${i}`;
      return `
        <tr class="cycle-row" onclick="document.getElementById('${id}').classList.toggle('hidden')">
          <td><code class="small">${new Date(e.timestamp).toLocaleString()}</code></td>
          <td>${action}</td>
          <td>${symbol}</td>
          <td><span class="badge ${approved ? "approve" : "veto"}">${approved ? "approved" : "vetoed"}</span></td>
          <td>${e.riskVerdict?.reason ?? ""}</td>
        </tr>
        <tr class="reasoning-row hidden" id="${id}"><td colspan="5">${
          e.themeContext ? `<strong>Sense-layer context fed to the LLM:</strong>\n${e.themeContext.replace(/</g, "&lt;")}\n\n<strong>Reasoning:</strong>\n` : ""
        }${(e.llmReasoning ?? "").replace(/</g, "&lt;")}</td></tr>
      `;
    })
    .join("");

  wrap.innerHTML = `
    <table>
      <thead><tr><th>Time</th><th>Action</th><th>Symbol</th><th>Risk gate</th><th>Reason</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  const ctx = document.getElementById("equityChart");
  new Chart(ctx, {
    type: "line",
    data: {
      labels: equityCurve.map((p) => new Date(p.timestamp).toLocaleString()),
      datasets: [{
        label: "Equity ($)",
        data: equityCurve.map((p) => p.equity),
        borderColor: "#4fd1c5",
        backgroundColor: "rgba(79,209,197,0.1)",
        fill: true,
        tension: 0.15,
        pointRadius: 0,
      }],
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b98a5", maxTicksLimit: 8 }, grid: { color: "#232c38" } },
        y: { ticks: { color: "#8b98a5" }, grid: { color: "#232c38" } },
      },
    },
  });
}

loadLog().then(render);
</script>
<style>.hidden { display: none; }</style>
</body>
</html>
